<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <rect x="5" y="5" width="390" height="150" fill="#f4ebd0" stroke="#776442" stroke-width="2" rx="4"/>
